---
# Fleet Inventory — Starfall Defence Corps
# Mixed OS fleet: Ubuntu and Rocky Linux.
# The SSH key path comes from ansible.cfg (present in both the project
# root and workspace/), so commands work from either directory.

all:
  children:
    debian:
      children:
        web_servers:
          hosts:
            sdc-web:
              ansible_host: localhost
              ansible_port: 2221
              ansible_user: cadet
        comms_relays:
          hosts:
            sdc-comms:
              ansible_host: localhost
              ansible_port: 2223
              ansible_user: cadet
    redhat:
      children:
        db_servers:
          hosts:
            sdc-db:
              ansible_host: localhost
              ansible_port: 2222
              ansible_user: cadet
